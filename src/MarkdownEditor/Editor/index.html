<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: http: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Markdown Редактор</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <div class="brand"><span class="brand-icon">M<span>↓</span></span><div><strong>Markdown Редактор</strong><small>Документ у фокусі</small></div></div>
    <span class="header-document-state" id="header-document-state">Без назви</span>
  </header>
  <nav id="menu-bar" aria-label="Головне меню">
    <details data-menu="file"><summary>Файл</summary><div class="menu-popup">
      <button data-file="new">Новий <kbd>Ctrl+N</kbd></button><button data-file="open">Відкрити… <kbd>Ctrl+O</kbd></button><hr>
      <button data-file="save">Зберегти <kbd>Ctrl+S</kbd></button><button data-file="saveAs">Зберегти як… <kbd>Ctrl+Shift+S</kbd></button><hr>
      <button data-v2="recovery">Відновити чернетку</button><button data-v2="reload">Перечитати файл</button><hr>
      <button data-v2="print">Друк… <kbd>Ctrl+P</kbd></button><button data-v2="pdf">Експорт у PDF…</button><button data-v2="html">Експорт у HTML…</button>
    </div></details>
    <details data-menu="edit"><summary>Правка</summary><div class="menu-popup">
      <button data-v2="undo">Скасувати <kbd>Ctrl+Z</kbd></button><button data-v2="redo">Повторити <kbd>Ctrl+Y</kbd></button><hr>
      <button data-v2="cut">Вирізати <kbd>Ctrl+X</kbd></button><button data-v2="copy">Копіювати <kbd>Ctrl+C</kbd></button><button data-v2="paste">Вставити <kbd>Ctrl+V</kbd></button><button data-v2="pasteMarkdown">Вставити Markdown <kbd>Ctrl+Shift+V</kbd></button><hr>
      <button data-v2="find">Знайти / замінити <kbd>Ctrl+F</kbd></button>
    </div></details>
    <details data-menu="insert"><summary>Вставка</summary><div class="menu-popup">
      <button id="insert-table" title="Створити таблицю">Таблиця…</button><button data-v2="link">Посилання…</button><button data-v2="image">Зображення…</button><button data-v2="task">Чекліст</button><hr>
      <button data-v2="inlineCode">Код у рядку</button><button data-v2="code">Блок коду…</button><button data-v2="quote">Цитата</button><button data-v2="rule">Розділювач</button>
    </div></details>
    <details data-menu="format"><summary>Формат</summary><div class="menu-popup">
      <button data-command="bold"><b>Жирний</b> <kbd>Ctrl+B</kbd></button><button data-command="italic"><i>Курсив</i> <kbd>Ctrl+I</kbd></button><button data-command="strikeThrough"><s>Закреслений</s> <kbd>Ctrl+Shift+X</kbd></button><hr>
      <button data-command="insertUnorderedList">Маркований список</button><button data-command="insertOrderedList">Нумерований список</button><hr>
      <button data-v2="indent">Вкласти пункт <kbd>Tab</kbd></button><button data-v2="outdent">Підняти рівень <kbd>Shift+Tab</kbd></button>
    </div></details>
    <details data-menu="table"><summary>Таблиця</summary><div class="menu-popup">
      <button data-table="rowAdd">Додати рядок нижче</button><button data-table="rowDelete">Видалити рядок</button><hr>
      <button data-table="columnAddLeft">Додати стовпець ліворуч</button><button data-table="columnAdd">Додати стовпець праворуч</button><button data-table="columnDelete">Видалити стовпець</button><button data-table="delete">Видалити таблицю</button><hr>
      <button data-table-v2="selectRow">Виділити рядок</button><button data-table-v2="selectColumn">Виділити стовпець</button><button data-table-v2="rowUp">Перемістити рядки вгору</button><button data-table-v2="rowDown">Перемістити рядки вниз</button><button data-table-v2="columnLeft">Перемістити стовпці ліворуч</button><button data-table-v2="columnRight">Перемістити стовпці праворуч</button><hr>
      <button data-table-v2="alignLeft">Вирівняти ліворуч</button><button data-table-v2="alignCenter">Вирівняти по центру</button><button data-table-v2="alignRight">Вирівняти праворуч</button>
    </div></details>
    <details data-menu="view"><summary>Вигляд</summary><div class="menu-popup">
      <button data-v2="outline">Зміст документа</button><button data-v2="source">Редагувати Markdown</button><button data-v2="blockSource">Джерело вибраного блока</button><hr>
      <button data-view="theme">Темна тема</button><hr>
      <button data-view="fontDown">Зменшити текст</button><button data-view="fontReset">Стандартний розмір</button><button data-view="fontUp">Збільшити текст</button><hr>
      <button data-view="focus" aria-pressed="false">Фокус на абзаці</button><button data-view="typewriter" aria-pressed="false">Режим друкарської машинки</button><hr>
      <button id="load-remote-images" data-icon="image">Завантажити зовнішні зображення</button>
    </div></details>
  </nav>
  <nav class="toolbar" aria-label="Форматування">
    <button class="icon-only" data-v2="undo" title="Скасувати (Ctrl+Z)" aria-label="Скасувати"></button>
    <button class="icon-only" data-v2="redo" title="Повторити (Ctrl+Y)" aria-label="Повторити"></button>
    <button class="icon-only" data-file="open" title="Відкрити (Ctrl+O)" aria-label="Відкрити"></button>
    <button class="icon-only" data-file="save" title="Зберегти (Ctrl+S)" aria-label="Зберегти"></button>
    <button class="icon-only" data-v2="copy" title="Копіювати (Ctrl+C)" aria-label="Копіювати"></button>
    <button class="icon-only" data-v2="cut" title="Вирізати (Ctrl+X)" aria-label="Вирізати"></button>
    <button class="icon-only" data-v2="paste" title="Вставити (Ctrl+V)" aria-label="Вставити"></button>
    <span class="separator"></span>
    <label class="style-control"><span class="sr-only">Стиль абзацу</span><select id="block-style" aria-label="Стиль абзацу"><option value="p">Звичайний текст</option><option value="h1">Заголовок 1</option><option value="h2">Заголовок 2</option><option value="h3">Заголовок 3</option><option value="h4">Заголовок 4</option><option value="h5">Заголовок 5</option><option value="h6">Заголовок 6</option></select></label>
    <span class="separator"></span>
    <button class="icon-only" data-command="bold" title="Жирний (Ctrl+B)" aria-label="Жирний" aria-pressed="false"></button>
    <button class="icon-only" data-command="italic" title="Курсив (Ctrl+I)" aria-label="Курсив" aria-pressed="false"></button>
    <button class="icon-only" data-command="strikeThrough" title="Закреслений (Ctrl+Shift+X)" aria-label="Закреслений" aria-pressed="false"></button>
    <span class="separator"></span>
    <button class="icon-only" data-command="insertUnorderedList" title="Маркований список" aria-label="Маркований список" aria-pressed="false"></button>
    <button class="icon-only" data-command="insertOrderedList" title="Нумерований список" aria-label="Нумерований список" aria-pressed="false"></button>
    <span class="separator"></span>
    <button class="icon-only" data-v2="link" title="Вставити посилання" aria-label="Посилання"></button>
    <button class="icon-only" data-v2="image" title="Вставити зображення" aria-label="Зображення"></button>
    <button class="icon-only" data-v2="find" title="Знайти або замінити (Ctrl+F)" aria-label="Знайти"></button>
    <button class="icon-only" data-menu-trigger="insert-table" title="Створити таблицю" aria-label="Таблиця"></button>
  </nav>
  <div id="table-tools" class="table-tools" role="group" aria-label="Редагування таблиці">
    <span>Таблиця</span><button class="icon-only" data-table="rowAdd" title="Додати рядок нижче" aria-label="+ Рядок" disabled>+ Рядок</button><button class="icon-only" data-table="rowDelete" title="Видалити вибраний рядок" aria-label="− Рядок" disabled>− Рядок</button><button class="icon-only" data-table="columnAddLeft" title="Додати стовпець ліворуч" aria-label="+ Стовпець ліворуч" disabled>+ Стовпець ←</button><button class="icon-only" data-table="columnAdd" title="Додати стовпець праворуч" aria-label="+ Стовпець праворуч" disabled>+ Стовпець</button><button class="icon-only" data-table="columnDelete" title="Видалити вибраний стовпець" aria-label="− Стовпець" disabled>− Стовпець</button><button class="icon-only" data-table="delete" title="Видалити всю таблицю" aria-label="Видалити таблицю" disabled>Видалити таблицю</button><small id="table-hint">Оберіть клітинку таблиці</small>
  </div>
  <div id="notice" role="status" hidden></div>
  <main>
    <div class="document-meta"><span id="file-name">Без назви</span><span id="document-state">Усі зміни збережено</span></div>
    <article id="editor" contenteditable="true" role="textbox" aria-label="Документ" aria-multiline="true" spellcheck="false"><p><br></p></article>
    <div class="page-end" aria-hidden="true">✧</div>
  </main>
  <footer><span><span class="status-dot"></span> <span id="footer-status">Готово до роботи</span></span><span id="word-count">0 слів</span><span>UTF-8 <span class="footer-divider">/</span> Markdown</span></footer>
  <dialog id="table-dialog">
    <form id="table-form">
      <h2>Нова таблиця</h2><p>Перший рядок буде заголовком.</p>
      <label>Рядків разом із заголовком <input id="table-rows" type="number" min="1" max="100" value="3" required></label>
      <label>Стовпців <input id="table-columns" type="number" min="1" max="20" value="3" required></label>
      <div class="dialog-actions"><button type="button" id="cancel-table">Скасувати</button><button class="primary" type="submit">Створити</button></div>
    </form>
  </dialog>
  <div id="context-menu" role="menu" aria-label="Команди редактора" hidden>
    <button role="menuitem" data-command="bold" aria-label="Жирний" aria-keyshortcuts="Control+B">Жирний<kbd>Ctrl+B</kbd></button>
    <button role="menuitem" data-command="italic" aria-label="Курсив" aria-keyshortcuts="Control+I">Курсив<kbd>Ctrl+I</kbd></button>
    <button role="menuitem" data-command="strikeThrough" aria-label="Закреслений" aria-keyshortcuts="Control+Shift+X">Закреслений<kbd>Ctrl+Shift+X</kbd></button>
    <div class="menu-divider" role="separator"></div>
    <button role="menuitem" data-command="insertUnorderedList">Маркований список</button>
    <button role="menuitem" data-command="insertOrderedList">Нумерований список</button>
    <div id="context-table" hidden>
      <div class="menu-divider" role="separator"></div>
      <button role="menuitem" data-table="rowAdd">Додати рядок нижче</button>
      <button role="menuitem" data-table="rowDelete">Видалити рядок</button>
      <button role="menuitem" data-table="columnAddLeft">Додати стовпець ліворуч</button>
      <button role="menuitem" data-table="columnAdd">Додати стовпець праворуч</button>
      <button role="menuitem" data-table="columnDelete">Видалити стовпець</button>
      <button role="menuitem" data-table="delete">Видалити таблицю</button>
    </div>
  </div>
  <script type="module" src="editor.js"></script>
</body>
</html>
